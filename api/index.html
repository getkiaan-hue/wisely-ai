<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisely AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdnjs.cloudflare.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root{--bg:#f4f6fa;--side:#ffffff;--card:#ffffff;--line:#e3e7ef;--text:#1d2433;--muted:#6b7488;--accent:#e8a33a;--accent-soft:#fdf3e1;--blue:#3b6cf6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
  button{font:inherit;color:inherit;cursor:pointer}
  .app{display:flex;height:100%}

  /* Sidebar */
  aside{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:700;font-size:18px}
  .brand svg{width:30px;height:30px}
  .brand span{color:var(--accent)}
  .newchat{margin:0 12px 10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;text-align:left}
  .newchat:hover{border-color:var(--accent)}
  .side-scroll{flex:1;overflow-y:auto;padding:0 8px 12px}
  .sec{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .sec button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
  .sec button:hover{color:var(--accent)}
  .item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer}
  .item:hover{background:var(--bg)}
  .item.on{background:var(--accent-soft)}
  .item .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  .item .act{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--muted);opacity:0;font-size:13px}
  .item:hover .act,.item .act.pinned{opacity:1}
  .item .act:hover{background:var(--line)}
  .empty{padding:4px 8px;color:var(--muted);font-size:13px}
  .proj-input{width:100%;padding:7px 8px;border:1px solid var(--accent);border-radius:8px;font:inherit;font-size:14px;outline:0}
  .sub{padding-left:18px}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg)}
  .menu{display:none;border:0;background:none;font-size:20px;padding:0 4px}
  .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb{color:var(--muted);font-size:13px;white-space:nowrap}
  .modes{margin-left:auto;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
  .mode{border:0;background:none;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--muted)}
  .mode.on{background:var(--accent);color:#fff}
  #scroll{flex:1;overflow-y:auto}
  .wrap{max-width:740px;margin:0 auto;padding:24px 18px}
  .hero{text-align:center;padding:60px 0 20px}
  .hero svg{width:60px;height:60px}
  .hero h1{font-size:28px;margin:14px 0 6px}
  .hero p{color:var(--muted);margin:0 0 24px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px}
  .chip:hover{border-color:var(--accent)}
  .msg{display:flex;gap:10px;margin:16px 0}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:85%;padding:11px 15px;border-radius:14px;line-height:1.55;overflow-wrap:anywhere}
  .user .bubble{background:var(--blue);color:#fff;white-space:pre-wrap}
  .bot .bubble{background:var(--card);border:1px solid var(--line)}
  .avatar{width:28px;height:28px;flex:none;margin-top:3px}
  .bubble p{margin:0 0 .7em}.bubble p:last-child{margin:0}
  .bubble ul,.bubble ol{margin:.3em 0 .7em;padding-left:1.3em}
  .bubble code{background:#f0f2f6;padding:2px 5px;border-radius:5px;font-size:13px}
  .bubble pre{background:#f0f2f6;padding:12px;border-radius:8px;overflow-x:auto}
  .bubble pre code{padding:0}
  .thinking{color:var(--muted);font-style:italic}
  .err{color:#c0392b}
  footer{padding:12px 18px 16px}
  .attach-btn{width:36px;height:38px;border:0;background:none;border-radius:10px;font-size:18px;flex:none}
  .attach-btn:hover{background:var(--bg)}
  .pending{max-width:740px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px}
  .pending:not(:empty){margin-bottom:8px}
  .att{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 4px;font-size:13px;max-width:230px;color:var(--text)}
  .att img{width:36px;height:36px;object-fit:cover;border-radius:6px;flex:none}
  .att .ic{width:36px;height:36px;display:grid;place-items:center;background:var(--bg);border-radius:6px;font-size:18px;flex:none}
  .att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att button{border:0;background:none;color:var(--muted);font-size:15px;padding:0 2px}
  .att.loading{opacity:.6}
  .toast{font-size:13px;color:#c0392b;padding:6px 2px}
  .user .bubble.has-atts{background:transparent;padding:0;color:var(--text)}
  .user .atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .user .atts img{max-width:220px;max-height:220px;border-radius:12px;border:1px solid var(--line);display:block}
  .user .txt{background:var(--blue);color:#fff;padding:11px 15px;border-radius:14px;margin-top:6px;white-space:pre-wrap;display:inline-block}
  .user .bubble.has-atts{text-align:right;white-space:normal}
  .account{border-top:1px solid var(--line);padding:12px 14px;font-size:13px;display:none}
  .account.on{display:block}
  .account .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .account .left{color:var(--muted);margin:3px 0 8px}
  .meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
  .meter i{display:block;height:100%;background:var(--accent);width:0}
  .account button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:12px}
  .signin{position:fixed;inset:0;background:rgba(29,36,51,.45);display:none;place-items:center;z-index:30;padding:16px}
  .signin.on{display:grid}
  .signin .card{background:var(--card);border-radius:18px;padding:28px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .signin svg{width:56px;height:56px}
  .signin h2{margin:12px 0 4px;font-size:22px}
  .signin p{color:var(--muted);margin:0 0 18px;line-height:1.5}
  .signin input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;outline:0;margin-bottom:10px}
  .signin input:focus{border-color:var(--accent)}
  .signin .go{width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
  .signin .go:disabled{opacity:.5}
  .signin .msg{font-size:13px;margin-top:12px;min-height:1em}
  .signin .msg.bad{color:#c0392b}
  .signin .perks{font-size:13px;color:var(--muted);margin-top:16px}
  .limit-box{background:var(--accent-soft);color:#7a5410;border-radius:12px;padding:12px 14px;line-height:1.5}
  .dropzone{position:fixed;inset:0;background:rgba(232,163,58,.15);border:3px dashed var(--accent);display:none;place-items:center;font-size:22px;font-weight:600;color:#7a5410;z-index:20;pointer-events:none}
  .dropzone.on{display:grid}
  #form{max-width:740px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px}
  #form:focus-within{border-color:var(--accent)}
  textarea{flex:1;resize:none;border:0;outline:0;background:transparent;font:inherit;line-height:1.5;max-height:180px;padding:8px 0}
  .send{width:38px;height:38px;border-radius:10px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
  .send:disabled{opacity:.4;cursor:default}
  .note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
  .unavail{max-width:740px;margin:0 auto 8px;padding:9px 13px;border-radius:10px;background:var(--accent-soft);color:#7a5410;font-size:13px;display:none}

  @media (max-width:760px){
    aside{position:fixed;inset:0 auto 0 0;z-index:10;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
    aside.open{transform:none}
    .menu{display:block}
    .crumb{display:none}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="owl" viewBox="0 0 64 64">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#fdf3e1"/>
    <path d="M16 20 L22 13 L27 20 M37 20 L42 13 L48 20" fill="none" stroke="#e8a33a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 26c0-5 4-8 9-8h18c5 0 9 3 9 8v12c0 10-8 16-18 16S14 48 14 38z" fill="#e8a33a"/>
    <circle cx="24" cy="30" r="7" fill="#1d2433"/><circle cx="40" cy="30" r="7" fill="#1d2433"/>
    <circle cx="25.5" cy="29" r="2.4" fill="#fff"/><circle cx="41.5" cy="29" r="2.4" fill="#fff"/>
    <path d="M29 37 L32 42 L35 37 Z" fill="#1d2433"/>
  </symbol>
</defs></svg>

<div class="app">
  <aside id="side">
    <div class="brand"><svg><use href="#owl"/></svg>Wisely <span>AI</span></div>
    <button class="newchat" id="newChat">＋ New chat</button>
    <div class="side-scroll">
      <div class="sec">📌 Pinned</div>
      <div id="pinned"></div>
      <div class="sec">📁 Projects <button id="addProj" title="New project">＋</button></div>
      <div id="projects"></div>
      <div class="sec">💬 Recent chats</div>
      <div id="recent"></div>
    </div>
    <div class="account" id="account">
      <div class="who" id="accWho"></div>
      <div class="meter"><i id="accBar"></i></div>
      <div class="left" id="accLeft"></div>
      <button id="signOut">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <button class="menu" id="menu" aria-label="Menu">☰</button>
      <div class="title" id="title">New chat</div>
      <div class="crumb" id="crumb"></div>
      <div class="modes" id="modes">
        <button class="mode on" data-mode="balanced">Balanced</button>
        <button class="mode" data-mode="homework">Homework</button>
        <button class="mode" data-mode="creative">Creative</button>
      </div>
    </div>
    <div id="scroll"><div class="wrap" id="chat"></div></div>
    <footer>
      <div class="pending" id="pending"></div>
      <form id="form">
        <button type="button" class="attach-btn" id="attachBtn" title="Add photos, PDFs and documents">📎</button>
        <button type="button" class="attach-btn" id="camBtn" title="Take a photo">📷</button>
        <textarea id="input" rows="1" placeholder="Ask Wisely anything, or paste a link…"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="note">Wisely AI can make mistakes. Double-check important stuff.</div>
      <input type="file" id="fileIn" multiple hidden accept="image/*,.pdf,.docx,.txt,.md,.csv,.json,.html,.htm,.js,.ts,.py,.java,.c,.cpp,.h,.css,.xml,.sql">
      <input type="file" id="camIn" hidden accept="image/*" capture="environment">
    </footer>
    <div class="signin" id="signin">
      <form class="card" id="signinForm">
        <svg><use href="#owl"/></svg>
        <h2>Sign in to Wisely</h2>
        <p id="signinText">Type your email and we'll send you a sign-in link. No password needed.</p>
        <input type="email" id="signinEmail" placeholder="you@example.com" required autocomplete="email">
        <button class="go" id="signinGo" type="submit">Email me a sign-in link</button>
        <div class="msg" id="signinMsg"></div>
        <div class="perks" id="signinPerks"></div>
      </form>
    </div>
    <div class="dropzone" id="dropzone">Drop files to add them 🦉</div>
  </div>
</div>

<script>
// Wisely's personality and modes live in api/chat.js, so visitors can't change them.
const KEY = "wisely-ai-v1";

const $ = id => document.getElementById(id);
const chatEl = $("chat"), input = $("input"), sendBtn = $("send"), scroller = $("scroll");
let state = { chats: [], projects: [], open: {} };
let current = null;          // current chat object (or null = fresh, unsaved)
let activeProject = null;    // project new chats go into
let addingProject = false;

// ---------- storage ----------
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.chats) state = Object.assign(state, s); } catch(e){} }
// Photos and files are too big to save in the browser, so only their names are saved.
// Keys starting with "_" are temporary (like an answer still being written) and aren't saved either.
let saveWarned = false;
function save(){
  if (current) state.last = current.id;
  try { localStorage.setItem(KEY, JSON.stringify(state, (k, v) => (k === "data" || k === "ftext" || k === "thumb" || k[0] === "_") ? undefined : v)); }
  catch(e){ if (!saveWarned) { saveWarned = true; toast("⚠️ Your browser blocked saving chats (private window, or storage is full). Chats will be lost when you close this tab."); } }
}
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
function md(t){ try { return DOMPurify.sanitize(marked.parse(t)); } catch(e){ return esc(t); } }

// ---------- sidebar ----------
function chatItem(c, indent){
  const el = document.createElement("div");
  el.className = "item" + (indent ? " sub" : "") + (current && current.id === c.id ? " on" : "");
  el.innerHTML = '<span class="name"></span>' +
    '<button class="act' + (c.pinned ? " pinned" : "") + '" data-pin title="' + (c.pinned ? "Unpin" : "Pin") + '">' + (c.pinned ? "📌" : "📍") + '</button>' +
    '<button class="act" data-del title="Delete">🗑</button>';
  el.querySelector(".name").textContent = c.title;
  el.onclick = e => {
    if (e.target.closest("[data-pin]")) { c.pinned = !c.pinned; save(); renderSide(); return; }
    if (e.target.closest("[data-del]")) { state.chats = state.chats.filter(x => x !== c); if (current === c) newChat(); save(); renderSide(); return; }
    openChat(c);
  };
  return el;
}

function renderSide(){
  const byDate = [...state.chats].sort((a,b) => b.updated - a.updated);
  const pinned = $("pinned"); pinned.innerHTML = "";
  const pins = byDate.filter(c => c.pinned);
  pins.length ? pins.forEach(c => pinned.appendChild(chatItem(c))) : pinned.innerHTML = '<div class="empty">Pin a chat to keep it here</div>';

  const pr = $("projects"); pr.innerHTML = "";
  if (addingProject) {
    const inp = document.createElement("input");
    inp.className = "proj-input"; inp.placeholder = "Project name, then Enter";
    inp.onkeydown = e => {
      if (e.key === "Enter" && inp.value.trim()) { const p = { id: uid(), name: inp.value.trim() }; state.projects.push(p); state.open[p.id] = true; addingProject = false; save(); selectProject(p); }
      if (e.key === "Escape") { addingProject = false; renderSide(); }
    };
    inp.onblur = () => { setTimeout(() => { if (addingProject) { addingProject = false; renderSide(); } }, 150); };
    pr.appendChild(inp); setTimeout(() => inp.focus());
  }
  if (!state.projects.length && !addingProject) pr.innerHTML = '<div class="empty">Group chats into projects</div>';
  state.projects.forEach(p => {
    const el = document.createElement("div");
    el.className = "item" + (activeProject === p.id && !current ? " on" : "");
    const isOpen = !!state.open[p.id];
    el.innerHTML = '<span>' + (isOpen ? "▾" : "▸") + '</span><span class="name"></span><button class="act" data-new title="New chat in project">＋</button><button class="act" data-del title="Delete project">🗑</button>';
    el.querySelector(".name").textContent = p.name;
    el.onclick = e => {
      if (e.target.closest("[data-new]")) { selectProject(p); return; }
      if (e.target.closest("[data-del]")) {
        state.chats = state.chats.filter(c => c.projectId !== p.id);
        state.projects = state.projects.filter(x => x !== p);
        if (activeProject === p.id) activeProject = null;
        if (current && current.projectId === p.id) newChat();
        save(); renderSide(); return;
      }
      state.open[p.id] = !isOpen; save(); renderSide();
    };
    pr.appendChild(el);
    if (isOpen) {
      const kids = byDate.filter(c => c.projectId === p.id);
      kids.length ? kids.forEach(c => pr.appendChild(chatItem(c, true))) : pr.insertAdjacentHTML("beforeend", '<div class="empty sub">No chats yet</div>');
    }
  });

  const rc = $("recent"); rc.innerHTML = "";
  const recent = byDate.filter(c => !c.projectId);
  recent.length ? recent.forEach(c => rc.appendChild(chatItem(c))) : rc.innerHTML = '<div class="empty">Your chats will show up here</div>';
  updateTop();
}

function updateTop(){
  $("title").textContent = current ? current.title : "New chat";
  const pid = current ? current.projectId : activeProject;
  const p = state.projects.find(x => x.id === pid);
  $("crumb").textContent = p ? "in 📁 " + p.name : "";
}

// ---------- chat view ----------
const ICONS = { image: "🖼️", pdf: "📕", doc: "📄", text: "📝" };
function attChip(a, removable){
  const el = document.createElement("div");
  el.className = "att";
  el.innerHTML = (a.thumb ? '<img alt="">' : '<span class="ic">' + (ICONS[a.kind] || "📎") + '</span>') + '<span class="nm"></span>' + (removable ? '<button title="Remove">×</button>' : "");
  if (a.thumb) el.querySelector("img").src = a.thumb;
  el.querySelector(".nm").textContent = a.name;
  return el;
}

function addMsg(role, html, atts){
  chatEl.querySelector(".hero")?.remove();
  const row = document.createElement("div");
  row.className = "msg " + (role === "user" ? "user" : "bot");
  if (role !== "user") row.innerHTML = '<svg class="avatar"><use href="#owl"/></svg>';
  const b = document.createElement("div"); b.className = "bubble";
  if (role === "user" && atts && atts.length) {
    b.classList.add("has-atts");
    const box = document.createElement("div"); box.className = "atts";
    atts.forEach(a => {
      if (a.thumb) { const img = document.createElement("img"); img.src = a.thumb; img.alt = a.name; box.appendChild(img); }
      else box.appendChild(attChip(a, false));
    });
    b.appendChild(box);
    if (html) { const t = document.createElement("div"); t.className = "txt"; t.textContent = html; b.appendChild(t); }
  } else if (role === "user") b.textContent = html; else b.innerHTML = html;
  row.appendChild(b); chatEl.appendChild(row); scroller.scrollTop = scroller.scrollHeight;
  return b;
}

function showHero(){
  const p = state.projects.find(x => x.id === activeProject);
  chatEl.innerHTML = '<section class="hero"><svg><use href="#owl"/></svg><h1>Hey, I\'m Wisely.</h1><p>' +
    (p ? "New chat in <b>" + esc(p.name) + "</b>. What are we working on?" : "Ask me anything: homework, ideas, advice, or random questions.") +
    '</p><div class="chips">' +
    ['Explain how black holes work like I\'m 12.', 'Give me 10 catchy YouTube title ideas for a gaming clips video.', 'Help me make a study plan for a test next week.', 'Tell me a crazy fact I\'ve never heard.']
      .map(q => '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>').join("") + '</div></section>';
}

function setMode(m){ document.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x.dataset.mode === m)); }
function curMode(){ return document.querySelector(".mode.on").dataset.mode; }

// While Wisely is answering, the answer so far lives in chat._live, and chat._bubble is where it's shown.
function liveHTML(c){ return c._live ? md(c._live) : '<span class="thinking">Wisely is thinking…</span>'; }
function updateSendBtn(){ sendBtn.disabled = !!(current && current._busy); }

function openChat(c, fromHash){
  current = c; activeProject = c.projectId || null;
  chatEl.innerHTML = "";
  c.messages.forEach(m => addMsg(m.role, m.role === "user" ? m.content : md(m.content), m.attachments));
  if (c._busy) c._bubble = addMsg("bot", liveHTML(c));
  setMode(c.mode || "balanced");
  $("side").classList.remove("open");
  if (!fromHash) setHash("chat-" + c.id);
  state.last = c.id; save();
  renderSide(); updateSendBtn();
  scroller.scrollTop = scroller.scrollHeight;
}
function newChat(fromHash){
  current = null; activeProject = null; showHero(); setMode("balanced"); $("side").classList.remove("open");
  if (fromHash !== true) setHash("new");
  renderSide(); updateSendBtn(); input.focus();
}
function selectProject(p){ current = null; activeProject = p.id; state.open[p.id] = true; save(); showHero(); $("side").classList.remove("open"); setHash("new"); renderSide(); updateSendBtn(); input.focus(); }

// Each chat gets its own address (#chat-abc123), so Back/Forward and refreshing work.
let ignoreHash = false;
function setHash(h){ if (location.hash !== "#" + h) { ignoreHash = true; location.hash = h; } }
function route(){
  const h = location.hash.slice(1);
  const c = h.startsWith("chat-") && state.chats.find(x => x.id === h.slice(5));
  if (c) return openChat(c, true);
  // Fresh visit with no chat in the address: reopen the last chat you were on.
  const last = !h && state.chats.find(x => x.id === state.last);
  if (last) openChat(last); else newChat(true);
}
window.addEventListener("hashchange", () => {
  if (ignoreHash) { ignoreHash = false; return; }
  if (/access_token|error_description|error_code/.test(location.hash)) return;  // sign-in link, handled by setupAccounts
  route();
});

// ---------- attachments ----------
let pendingAtts = [], loadingCount = 0;
const MAX_ATTS = 5;
const TEXT_EXT = /\.(txt|md|csv|json|html?|js|ts|py|java|c|cpp|h|css|xml|sql)$/i;

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  $("pending").before(t); setTimeout(() => t.remove(), 5000);
}
function renderPending(){
  const box = $("pending"); box.innerHTML = "";
  pendingAtts.forEach((a, i) => {
    const chip = attChip(a, true);
    chip.querySelector("button").onclick = () => { pendingAtts.splice(i, 1); renderPending(); };
    box.appendChild(chip);
  });
  for (let i = 0; i < loadingCount; i++) box.insertAdjacentHTML("beforeend", '<div class="att loading"><span class="ic">⏳</span><span class="nm">Loading…</span></div>');
}
function fileToDataURL(f){
  return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => bad(new Error("couldn't read it")); r.readAsDataURL(f); });
}
async function shrinkImage(f){
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("couldn't open this photo")); i.src = url; });
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  } finally { URL.revokeObjectURL(url); }
}
let mammothLoading = null;
function loadMammoth(){
  if (window.mammoth) return Promise.resolve();
  return mammothLoading ||= new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js";
    s.onload = ok; s.onerror = () => bad(new Error("couldn't load the Word reader"));
    document.head.appendChild(s);
  });
}
async function readFile(f){
  const name = f.name || "photo.jpg";
  if (f.type.startsWith("image/")) {
    const url = await shrinkImage(f);
    return { kind: "image", name, mimeType: "image/jpeg", data: url.split(",")[1], thumb: url };
  }
  if (f.type === "application/pdf" || /\.pdf$/i.test(name)) {
    if (f.size > 2.5e6) throw new Error("PDF is too big (max 2.5 MB)");
    const url = await fileToDataURL(f);
    return { kind: "pdf", name, mimeType: "application/pdf", data: url.split(",")[1] };
  }
  if (/\.docx$/i.test(name)) {
    await loadMammoth();
    const out = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return { kind: "doc", name, ftext: out.value.slice(0, 100000) };
  }
  if (f.type.startsWith("text/") || TEXT_EXT.test(name)) {
    if (f.size > 2e6) throw new Error("file is too big (max 2 MB)");
    return { kind: "text", name, ftext: (await f.text()).slice(0, 100000) };
  }
  throw new Error("this file type isn't supported yet (try photos, PDFs, Word docs or text files)");
}
async function addFiles(list){
  const files = [...list];
  for (const f of files) {
    if (pendingAtts.length + loadingCount >= MAX_ATTS) { toast("You can add up to " + MAX_ATTS + " files per message."); break; }
    loadingCount++; renderPending();
    try { pendingAtts.push(await readFile(f)); }
    catch(e){ toast((f.name || "File") + ": " + e.message); }
    finally { loadingCount--; renderPending(); }
  }
}

// Build what gets sent to the server, dropping older files if it's too big.
function buildBody(chat, proj){
  const msgs = chat.messages.slice(-20).map(m => ({
    role: m.role, content: m.content,
    attachments: (m.attachments || []).map(a => ({ name: a.name, mimeType: a.mimeType, data: a.data, text: a.ftext }))
  }));
  const body = { mode: chat.mode, project: proj ? proj.name : null, messages: msgs };
  let s = JSON.stringify(body);
  for (let i = 0; s.length > 3.8e6 && i < msgs.length - 1; i++) {
    if (msgs[i].attachments.some(a => a.data)) {
      msgs[i].attachments = msgs[i].attachments.map(a => ({ name: a.name, text: a.text }));
      s = JSON.stringify(body);
    }
  }
  if (s.length > 3.8e6) throw new Error("toobig");
  return s;
}

async function send(text){
  text = text.trim();
  if (!text && !pendingAtts.length) return false;
  if (needsSignIn()) { showSignIn(); return false; }
  if (current && current._busy) { toast("Wait for Wisely to finish this answer, or start a new chat."); return false; }
  if (loadingCount) { toast("Wait a second, your files are still loading."); return false; }
  const atts = pendingAtts; pendingAtts = []; renderPending();
  const label = text || atts.map(a => a.name).join(", ");
  if (!current) {
    current = { id: uid(), title: label.length > 40 ? label.slice(0, 40) + "…" : label, messages: [], projectId: activeProject, pinned: false, mode: curMode(), updated: Date.now() };
    state.chats.push(current);
    setHash("chat-" + current.id);
  }
  const chat = current;
  chat.mode = curMode(); chat.updated = Date.now();
  chat._busy = true; chat._live = ""; updateSendBtn();
  addMsg("user", text, atts);
  chat.messages.push(atts.length ? { role: "user", content: text, attachments: atts } : { role: "user", content: text });
  save(); renderSide();

  chat._bubble = addMsg("bot", liveHTML(chat));
  const proj = state.projects.find(x => x.id === chat.projectId);
  // Show the answer as it arrives, at most once per frame (keeps long answers smooth).
  let drawQueued = false;
  const draw = () => {
    if (drawQueued) return; drawQueued = true;
    requestAnimationFrame(() => {
      drawQueued = false;
      if (current === chat && chat._bubble) { const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; chat._bubble.innerHTML = liveHTML(chat); if (nearBottom) scroller.scrollTop = scroller.scrollHeight; }
    });
  };

  let answer = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, session ? { authorization: "Bearer " + session.access_token } : {}),
      body: buildBody(chat, proj)
    });
    if (res.status === 401 && accounts.accounts) { session = null; showUsage(); showSignIn("Please sign in again."); throw Object.assign(new Error("signin"), {}); }
    if (res.status === 403) { const u = await res.json().catch(() => ({})); showUsage(u); throw Object.assign(new Error("limit"), { usage: u }); }
    if (res.headers.get("x-wisely-used")) showUsage({ used: res.headers.get("x-wisely-used"), limit: res.headers.get("x-wisely-limit"), plan: res.headers.get("x-wisely-plan") });
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      const err = new Error(res.status === 429 ? "busy" : res.status === 413 ? "toobig" : "failed");
      err.code = (t.match(/error (\d{3})/) || [])[1] || res.status;
      throw err;
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    // Backup: if nothing new arrives for 30 seconds, treat the answer as finished.
    const idle = () => new Promise(r => setTimeout(() => r({ done: true, idle: true }), 30000));
    while (true) {
      const { done, value, idle: timedOut } = await Promise.race([reader.read(), idle()]);
      if (timedOut) { reader.cancel().catch(() => {}); break; }
      if (done) break;
      answer += dec.decode(value, { stream: true });
      chat._live = answer; draw();
    }
    if (!answer) throw new Error("failed");
    chat.messages.push({ role: "assistant", content: answer });
    if (current === chat && chat._bubble) chat._bubble.innerHTML = md(answer);
  } catch(e){
    if (answer) { chat.messages.push({ role: "assistant", content: answer }); if (current === chat && chat._bubble) chat._bubble.innerHTML = md(answer); }
    else {
      const failed = chat.messages.pop();
      // Put the question back in the box so it can be sent again with one click.
      if (current === chat && !input.value && failed && failed.content) { input.value = failed.content; grow(); }
      const b = (current === chat && chat._bubble) || document.createElement("div");
      if (e.message === "limit") {
        b.innerHTML = '<div class="limit-box">🦉 <b>You\'ve used all ' + ((e.usage && e.usage.limit) || accounts.freeLimit || 23) + ' free messages for today.</b><br>They reset at midnight (Eastern time). <b>Wisely Pro</b> with unlimited messages is coming soon!</div>';
        return true;
      }
      if (e.message === "signin") { b.innerHTML = '<span class="err">Sign in to keep chatting.</span>'; return true; }
      const msg = e.message === "busy" ? "Wisely is resting! Too many questions right now. Try again in a minute, or tomorrow if the daily limit was reached."
                : e.message === "toobig" ? "Those files are too big to send together. Try fewer or smaller files."
                : "Hoo-oops, something went wrong" + (e.code ? " (error " + e.code + ")" : "") + ". Try again.";
      b.innerHTML = '<span class="err">' + msg + '</span>';
    }
  } finally {
    chat._busy = false; chat._live = ""; chat._bubble = null;
    chat.updated = Date.now(); save(); renderSide(); updateSendBtn();
    if (current === chat) input.focus();
  }
  return true;
}

// ---------- accounts (sign-in and daily limit) ----------
// Accounts only turn on once Supabase is set up in Vercel. Until then, no sign-in is needed.
let accounts = { accounts: false }, sb = null, session = null;
const needsSignIn = () => accounts.accounts && !session;

function loadScript(src){
  return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("couldn't load " + src)); document.head.appendChild(s); });
}
function showSignIn(note){
  $("signinPerks").textContent = "Free: " + (accounts.freeLimit || 23) + " messages a day. Your chats stay saved in this browser.";
  $("signinMsg").textContent = note || ""; $("signinMsg").className = "msg" + (note ? " bad" : "");
  $("signin").classList.add("on");
  setTimeout(() => $("signinEmail").focus(), 50);
}
function hideSignIn(){ $("signin").classList.remove("on"); }

function showUsage(u){
  const box = $("account");
  if (!accounts.accounts || !session) { box.classList.remove("on"); return; }
  box.classList.add("on");
  $("accWho").textContent = session.user?.email || "Signed in";
  if (!u) return;
  if (u.plan === "pro") { $("accLeft").textContent = "⭐ Pro: unlimited messages"; $("accBar").style.width = "100%"; return; }
  const limit = Number(u.limit) || accounts.freeLimit || 23, used = Math.min(Number(u.used) || 0, limit);
  $("accLeft").textContent = (limit - used) + " of " + limit + " free messages left today";
  $("accBar").style.width = (used / limit * 100) + "%";
}
async function refreshUsage(){
  if (!session) return;
  try {
    const r = await fetch("/api/me", { headers: { authorization: "Bearer " + session.access_token } });
    if (r.status === 401) { session = null; showUsage(); showSignIn("Your sign-in expired. Please sign in again."); return; }
    showUsage(await r.json());
  } catch(e){ showUsage(); }
}

async function setupAccounts(){
  try { accounts = await (await fetch("/api/config")).json(); } catch(e){ accounts = { accounts: false }; }
  if (!accounts.accounts) return;
  try {
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js");
    sb = window.supabase.createClient(accounts.supabaseUrl, accounts.supabaseKey, {
      auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
    });
    session = (await sb.auth.getSession()).data.session;
    // A sign-in link adds login details to the address; tidy them away.
    if (/access_token|error_description|error_code/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
    sb.auth.onAuthStateChange((event, s) => {
      session = s;
      if (s) { hideSignIn(); refreshUsage(); } else { showUsage(); showSignIn(); }
    });
  } catch(e){
    console.error(e);
    showSignIn("Sign-in isn't working right now. Try refreshing the page.");
    return;
  }
  if (session) { hideSignIn(); refreshUsage(); } else showSignIn();
}

$("signinForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!sb) return;
  const email = $("signinEmail").value.trim();
  $("signinGo").disabled = true; $("signinMsg").className = "msg"; $("signinMsg").textContent = "Sending…";
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  $("signinGo").disabled = false;
  if (error) {
    $("signinMsg").className = "msg bad";
    $("signinMsg").textContent = /rate|seconds|too many/i.test(error.message) ? "Too many emails sent. Wait a minute and try again." : "Couldn't send the email: " + error.message;
  } else {
    $("signinMsg").textContent = "✅ Check your email (" + email + ") and click the link. It opens Wisely signed in.";
  }
});
$("signOut").onclick = async () => { if (sb) await sb.auth.signOut(); session = null; showUsage(); showSignIn(); };

// ---------- events ----------
// Only clear the box if the message was actually sent, so nothing you type gets lost.
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const t = input.value;
  if ((t.trim() || pendingAtts.length) && !(current && current._busy) && !loadingCount && !needsSignIn()) { input.value = ""; grow(); }
  send(t);
});
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
function grow(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", grow);
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (chip) send(chip.dataset.q);
  const m = e.target.closest(".mode"); if (m) { setMode(m.dataset.mode); if (current) { current.mode = m.dataset.mode; save(); } }
});
$("attachBtn").onclick = () => $("fileIn").click();
$("camBtn").onclick = () => $("camIn").click();
$("fileIn").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("camIn").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
input.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])]; if (f.length) { e.preventDefault(); addFiles(f); } });
let dragDepth = 0;
document.addEventListener("dragenter", e => { if (e.dataTransfer?.types?.includes("Files")) { dragDepth++; $("dropzone").classList.add("on"); } });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("dropzone").classList.remove("on"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("dropzone").classList.remove("on"); if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });
$("newChat").onclick = () => newChat();
window.addEventListener("pagehide", () => {
  state.chats.forEach(c => { if (c._busy && c._live) { c.messages.push({ role: "assistant", content: c._live }); c._busy = false; c._live = ""; } });
  save();
});
$("addProj").onclick = () => { addingProject = true; state.projects.length; renderSide(); };
$("menu").onclick = () => $("side").classList.toggle("open");

// Start-up: load saved chats, wait for the formatting scripts, set up sign-in, then open the right chat.
load(); renderSide();
(async () => {
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r));
  await setupAccounts();
  if (!current) route();
})();
</script>
</body>
</html>
